name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Fix solver bug
        shell: pwsh
        run: |
          $file = "hangul_moa_bot.py"
          $text = Get-Content $file -Raw

          $old = "best = max(states, key=lambda x: evaluate_state(x[0], x[3], []))"
          $new = "best = max(states, key=lambda x: evaluate_state(x[0], x[2], []))"

          if ($text.Contains($old)) {
            $text = $text.Replace($old, $new)
            Write-Host "SOLVER FIX APPLIED"
          }
          elseif ($text.Contains($new)) {
            Write-Host "SOLVER FIX ALREADY APPLIED"
          }
          else {
            throw "Solver fix target not found"
          }

          Set-Content $file $text -Encoding UTF8

          Write-Host "========================================"
          Write-Host "SOURCE PATCH COMPLETE"
          Write-Host "========================================"

      - name: Check Python syntax
        run: |
          python -m py_compile hangul_moa_bot.py

      - name: Build EXE
        run: |
          pyinstaller --clean --onefile hangul_moa_bot.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: HangulMoaBot-Windows
          path: dist/hangul_moa_bot.exe
