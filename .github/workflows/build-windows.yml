name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Fix solver
        shell: pwsh
        run: |
          $file = "hangul_moa_bot.py"
          $text = Get-Content $file -Raw

          $old = "best = max(states, key=lambda x: evaluate_state(x[0], x[3], []))"
          $new = "best = max(states, key=lambda x: evaluate_state(x[0], x[2], []))"

          if ($text.Contains($old)) {
            $text = $text.Replace($old, $new)
            Write-Host "SOLVER FIX APPLIED"
          }
          elseif ($text.Contains($new)) {
            Write-Host "SOLVER FIX ALREADY APPLIED"
          }
          else {
            throw "Solver fix target not found"
          }

          Set-Content $file $text -Encoding UTF8

      - name: Add detector debug
        shell: pwsh
        run: |
          $file = "hangul_moa_bot.py"
          $text = Get-Content $file -Raw

          $old = @"
    mask = cv2.inRange(
        hsv,
        np.array([0, 115, 80], dtype=np.uint8),
        np.array([179, 255, 255], dtype=np.uint8),
    )
"@

          $new = @"
    # More tolerant color detection.
    # The original threshold was too strict for the actual game UI.
    mask = cv2.inRange(
        hsv,
        np.array([0, 60, 50], dtype=np.uint8),
        np.array([179, 255, 255], dtype=np.uint8),
    )
"@

          if ($text.Contains($old)) {
            $text = $text.Replace($old, $new)
            Write-Host "COLOR THRESHOLD FIX APPLIED"
          }
          else {
            Write-Host "COLOR THRESHOLD TARGET NOT FOUND"
          }

          $old = @"
        if (
            0.45 * cx <= w <= 1.25 * cx
            and 0.45 * cy <= h <= 1.25 * cy
            and 0.20 * cx * cy <= area <= 1.2 * cx * cy
        ):
"@

          $new = @"
        if (
            0.25 * cx <= w <= 2.5 * cx
            and 0.25 * cy <= h <= 2.5 * cy
            and 0.05 * cx * cy <= area <= 4.0 * cx * cy
        ):
"@

          if ($text.Contains($old)) {
            $text = $text.Replace($old, $new)
            Write-Host "CONTOUR FILTER FIX APPLIED"
          }
          else {
            Write-Host "CONTOUR FILTER TARGET NOT FOUND"
          }

          Set-Content $file $text -Encoding UTF8

      - name: Add detection logging
        shell: pwsh
        run: |
          $file = "hangul_moa_bot.py"
          $text = Get-Content $file -Raw

          $old = @"
        if not pieces:
            # Either the round ended or the UI is mid-animation.
            time.sleep(0.35)
            continue
"@

          $new = @"
        if not pieces:
            print(
                "조각 인식 실패 | "
                f"board=({cfg['board_x0']},{cfg['board_y0']}) "
                f"cell=({cfg['cell_x']:.2f},{cfg['cell_y']:.2f})"
            )
            g = panel_geometry(cfg)
            print(
                "panel="
                f"x:{g['panel_x1']}~{g['panel_x2']} "
                f"bands:{g['bands']}"
            )
            time.sleep(0.7)
            continue
"@

          if ($text.Contains($old)) {
            $text = $text.Replace($old, $new)
            Write-Host "DETECTION LOGGING ADDED"
          }
          else {
            Write-Host "DETECTION LOGGING TARGET NOT FOUND"
          }

          Set-Content $file $text -Encoding UTF8

      - name: Check Python syntax
        run: |
          python -m py_compile hangul_moa_bot.py

      - name: Build EXE
        run: |
          pyinstaller --clean --onefile hangul_moa_bot.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: HangulMoaBot-Windows
          path: dist/hangul_moa_bot.exe
