name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Fix bot source
        shell: pwsh
        run: |
          $file = "hangul_moa_bot.py"
          $text = Get-Content $file -Raw

          # ============================================================
          # FIX 1
          # solver에서 first_move(tuple)를 score로 사용하던 버그
          # ============================================================

          $old = "best = max(states, key=lambda x: evaluate_state(x[0], x[3], []))"
          $new = "best = max(states, key=lambda x: evaluate_state(x[0], x[2], []))"

          if ($text.Contains($old)) {
            $text = $text.Replace($old, $new)
            Write-Host "FIX 1: solver score fixed"
          }
          elseif ($text.Contains($new)) {
            Write-Host "FIX 1: already fixed"
          }
          else {
            throw "FIX 1 target not found"
          }


          # ============================================================
          # FIX 2
          # solve_current_pieces()가 depth를 반환하던 버그
          #
          # State:
          # (board, used, score, first_move, depth)
          #
          # main()에서는 네 번째 반환값을 first_move로 사용하므로
          # 마지막 반환값은 best[3]이어야 한다.
          # ============================================================

          $old = "return best[3], best[2], best[3], best[4]"
          $new = "return best[3], best[2], best[3], best[3]"

          if ($text.Contains($old)) {
            $text = $text.Replace($old, $new)
            Write-Host "FIX 2: first_move return fixed"
          }
          elseif ($text.Contains($new)) {
            Write-Host "FIX 2: already fixed"
          }
          else {
            throw "FIX 2 target not found"
          }


          # ============================================================
          # FIX 3
          # 조각 인식의 raw_norms row/column 순서 수정
          # ============================================================

          $old = "int(round((x - minx) / cx)),`r`n            int(round((y - miny) / cy)),"
          $new = "int(round((y - miny) / cy)),`r`n            int(round((x - minx) / cx)),"

          if ($text.Contains($old)) {
            $text = $text.Replace($old, $new)
            Write-Host "FIX 3: piece coordinates fixed"
          }
          elseif ($text.Contains($new)) {
            Write-Host "FIX 3: already fixed"
          }
          else {
            Write-Host "FIX 3: exact formatting not found - skipping"
          }


          # ============================================================
          # DEBUG
          # 조각 인식 실패 시 콘솔에 상태 표시
          # ============================================================

          $old = "if not pieces:`r`n            # Either the round ended or the UI is mid-animation.`r`n            time.sleep(0.35)`r`n            continue"

          $new = "if not pieces:`r`n            print('조각 인식 실패 - 패널 위치/색상 인식 확인 중...')`r`n            time.sleep(0.35)`r`n            continue"

          if ($text.Contains($old)) {
            $text = $text.Replace($old, $new)
            Write-Host "DEBUG: piece detection message added"
          }
          else {
            Write-Host "DEBUG: piece detection block formatting differs - skipped"
          }


          Set-Content $file $text -Encoding UTF8

          Write-Host ""
          Write-Host "========================================"
          Write-Host "ALL SOURCE PATCHES COMPLETE"
          Write-Host "========================================"


      - name: Check Python syntax
        run: |
          python -m py_compile hangul_moa_bot.py


      - name: Build EXE
        run: |
          pyinstaller --clean --onefile hangul_moa_bot.py


      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: HangulMoaBot-Windows
          path: dist/hangul_moa_bot.exe
